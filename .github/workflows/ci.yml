name: Node.js CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar a versão do Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Instalar dependências do Backend
      run: |
        cd backend
        npm install

    - name: Verificar se o servidor inicia sem erros
      run: |
        cd backend
        node -c src/server.js
        echo "Sintaxe do backend validada com sucesso!"
